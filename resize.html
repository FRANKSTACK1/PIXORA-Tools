  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="style.css" />
  <style>
    .dim-row { display: flex; gap: 16px; align-items: flex-end; flex-wrap: wrap; }
    .dim-row .form-group { flex: 1; min-width: 100px; }
    .lock-btn {
      width: 44px; height: 44px;
      border-radius: var(--radius-sm);
      border: 1.5px solid var(--border);
      background: var(--bg);
      cursor: pointer;
      font-size: 1.1rem;
      display: flex; align-items: center; justify-content: center;
      transition: all var(--transition);
      flex-shrink: 0;
      margin-bottom: 1px;
    }
    .lock-btn.locked { background: var(--teal-subtle); border-color: var(--teal); }
    .presets { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
    .preset-btn {
      padding: 6px 14px;
      border: 1px solid var(--border);
      border-radius: 100px;
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      background: var(--bg);
      color: var(--text-secondary);
      transition: all var(--transition);
    }
    .preset-btn:hover { background: var(--navy); color: #fff; border-color: var(--navy); }

    /* Font Awesome Visual Matching */
    .fa-icon,
    .upload-icon i,
    .tool-icon i,
    .feature-icon i,
    .preview-placeholder .icon i,
    .info-box .icon i,
    .badge i,
    .btn i {
      font-size: 1em;
      line-height: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      vertical-align: middle;
    }

    .upload-icon i {
      font-size: 2rem;
    }

    .tool-icon i,
    .feature-icon i {
      font-size: 1.4rem;
    }

    .preview-placeholder .icon i {
      font-size: 2rem;
    }

    .btn i {
      margin-right: 6px;
    }

    .badge i {
      margin-right: 6px;
    }
  </style>
</head>
<body>
  <div id="site-header"></div>
  <main>
    <div class="tool-page-header">
      <div class="container">
        <a href="tools.html" style="display:inline-flex;align-items:center;gap:6px;color:rgba(255,255,255,0.4);font-size:0.85rem;margin-bottom:20px;transition:color 0.2s" onmouseover="this.style.color='rgba(255,255,255,0.7)'" onmouseout="this.style.color='rgba(255,255,255,0.4)'"><i class="fas fa-arrow-left"></i> Back to Tools</a>
        <div class="badge badge-teal" style="margin-bottom:14px"><i class="fas fa-left-right"></i> Resize</div>
        <h1>Resize Image</h1>
        <p>Set exact pixel dimensions with optional aspect ratio lock and live preview.</p>
      </div>
    </div>
    <div class="tool-page-body">
      <div class="container">
        <div class="tool-workspace">
          <div class="upload-zone" id="upload-zone" style="margin-bottom:32px">
            <input type="file" accept="image/*" />
            <div class="upload-icon"><i class="fas fa-cloud-upload-alt"></i></div>
            <h3>Drop your image here</h3>
            <p>or click to browse — JPG, PNG, WebP</p>
          </div>

          <div style="margin-bottom:28px">
            <label style="font-weight:600;display:block;margin-bottom:4px">Dimensions</label>
            <p style="font-size:0.85rem;color:var(--text-muted);margin-bottom:16px">Current: <span id="current-dims">—</span></p>
            <div class="dim-row">
              <div class="form-group">
                <label for="img-width">Width (px)</label>
                <input type="number" id="img-width" placeholder="1920" min="1" max="8000" />
              </div>
              <button class="lock-btn locked" id="lock-btn" title="Lock aspect ratio" onclick="toggleLock()"><i class="fas fa-lock"></i></button>
              <div class="form-group">
                <label for="img-height">Height (px)</label>
                <input type="number" id="img-height" placeholder="1080" min="1" max="8000" />
              </div>
            </div>

            <div style="margin-top:16px">
              <label style="font-size:0.85rem;font-weight:500;color:var(--text-muted);display:block;margin-bottom:8px">Quick Presets</label>
              <div class="presets">
                <button class="preset-btn" onclick="setPreset(1920,1080)">1920×1080 HD</button>
                <button class="preset-btn" onclick="setPreset(1280,720)">1280×720</button>
                <button class="preset-btn" onclick="setPreset(800,600)">800×600</button>
                <button class="preset-btn" onclick="setPreset(1080,1080)">1080×1080 Square</button>
                <button class="preset-btn" onclick="setPreset(1200,628)">1200×628 OG</button>
                <button class="preset-btn" onclick="setPreset(400,400)">400×400 Avatar</button>
              </div>
            </div>
          </div>

          <div class="divider"></div>

          <!-- Preview -->
          <div style="margin-bottom:28px">
            <label style="font-weight:600;display:block;margin-bottom:12px">Preview</label>
            <div class="preview-box" style="min-height:220px">
              <img id="img-preview" alt="Preview" style="display:none;max-width:100%;max-height:280px;object-fit:contain" />
              <div class="preview-placeholder" id="ph"><div class="icon"><i class="fas fa-left-right"></i></div>Upload image to preview</div>
            </div>
            <p style="font-size:0.8rem;color:var(--text-muted);margin-top:8px">Output: <span id="output-dims">—</span></p>
          </div>

          <div style="display:flex;gap:12px;flex-wrap:wrap">
            <button class="btn btn-teal" onclick="resizeImage()"><i class="fas fa-left-right"></i> Resize Image</button>
            <a class="btn btn-primary" id="dl-btn" style="display:none" download="resized.png"><i class="fas fa-download"></i> Download</a>
            <button class="btn btn-ghost" onclick="resetTool()"><i class="fas fa-rotate-left"></i> Reset</button>
          </div>
        </div>
      </div>
    </div>
  </main>
  <div id="site-footer"></div>
  <script src="lock.js"></script>
  <script src="shared-layout.js"></script>
  <script src="main.js"></script>
  <script>
    const zone = document.getElementById('upload-zone');
    const fileInput = zone.querySelector('input[type="file"]');
    let loadedSrc = null, origW = 0, origH = 0, isLocked = true;

    function loadFile(file) {
      const reader = new FileReader();
      reader.onload = e => {
        loadedSrc = e.target.result;
        const img = new Image();
        img.onload = () => {
          origW = img.naturalWidth; origH = img.naturalHeight;
          document.getElementById('img-width').value = origW;
          document.getElementById('img-height').value = origH;
          document.getElementById('current-dims').textContent = origW + ' × ' + origH + ' px';
          updateOutputDims();
          const preview = document.getElementById('img-preview');
          preview.src = loadedSrc; preview.style.display = 'block';
          document.getElementById('ph').style.display = 'none';
        };
        img.src = loadedSrc;
        zone.querySelector('h3').textContent = file.name;
        zone.querySelector('p').textContent = 'Ready';
        zone.style.borderColor = 'var(--teal)';
      };
      reader.readAsDataURL(file);
    }

    fileInput.addEventListener('change', () => { if (fileInput.files[0]) loadFile(fileInput.files[0]); });
    zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('drag-over'); });
    zone.addEventListener('dragleave', () => zone.classList.remove('drag-over'));
    zone.addEventListener('drop', e => { e.preventDefault(); zone.classList.remove('drag-over'); if (e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0]); });

    document.getElementById('img-width').addEventListener('input', () => {
      if (isLocked && origW) document.getElementById('img-height').value = Math.round(parseInt(document.getElementById('img-width').value) / (origW / origH));
      updateOutputDims();
    });
    document.getElementById('img-height').addEventListener('input', () => {
      if (isLocked && origH) document.getElementById('img-width').value = Math.round(parseInt(document.getElementById('img-height').value) * (origW / origH));
      updateOutputDims();
    });

    function updateOutputDims() {
      const w = document.getElementById('img-width').value;
      const h = document.getElementById('img-height').value;
      document.getElementById('output-dims').textContent = (w && h) ? w + ' × ' + h + ' px' : '—';
    }

    function toggleLock() {
      isLocked = !isLocked;
      const btn = document.getElementById('lock-btn');
      btn.innerHTML = isLocked ? '<i class="fas fa-lock"></i>' : '<i class="fas fa-lock-open"></i>';
      btn.classList.toggle('locked', isLocked);
    }

    function setPreset(w, h) {
      document.getElementById('img-width').value = w;
      document.getElementById('img-height').value = h;
      updateOutputDims();
    }

    function resizeImage() {
      if (!loadedSrc) { alert('Please upload an image first.'); return; }
      const w = parseInt(document.getElementById('img-width').value);
      const h = parseInt(document.getElementById('img-height').value);
      if (!w || !h) { alert('Please set width and height.'); return; }
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        const dataUrl = canvas.toDataURL('image/png');
        const dl = document.getElementById('dl-btn');
        dl.href = dataUrl; dl.download = 'resized_' + w + 'x' + h + '.png';
        dl.style.display = 'inline-flex';
      };
      img.src = loadedSrc;
    }

    function resetTool() {
      loadedSrc = null; origW = 0; origH = 0;
      document.getElementById('img-preview').style.display = 'none';
      document.getElementById('ph').style.display = '';
      document.getElementById('dl-btn').style.display = 'none';
      document.getElementById('img-width').value = '';
      document.getElementById('img-height').value = '';
      document.getElementById('current-dims').textContent = '—';
      document.getElementById('output-dims').textContent = '—';
      zone.querySelector('h3').textContent = 'Drop your image here';
      zone.querySelector('p').textContent = 'or click to browse — JPG, PNG, WebP';
      zone.style.borderColor = ''; fileInput.value = '';
    }
  </script>
</body>
</html>
